patch:
  # 全局默认设定：默认进入英文模式
  ascii_mode: true
  ascii_punct: false

  # 分应用中英文自动切换设定 (默认全局英文，仅聊天通讯与浏览器等特定应用自动切中文)
  app_options:
    # ─── 聊天与通讯软件 (自动切中文) ───
    com.tencent.xinWeChat:
      ascii_mode: false
    org.telegram.desktop:
      ascii_mode: false
    ru.keepcoder.Telegram:
      ascii_mode: false
    com.electron.lark:
      ascii_mode: false
    com.alibaba.DingTalkMac:
      ascii_mode: false
    com.apple.MobileSMS:
      ascii_mode: false

    # ─── 网页浏览器 (自动切中文) ───
    com.google.Chrome:
      ascii_mode: false
    com.apple.Safari:
      ascii_mode: false
    com.microsoft.edgemac:
      ascii_mode: false
    company.thebrowser.Browser:
      ascii_mode: false
    org.mozilla.firefox:
      ascii_mode: false

    # ─── 特殊办公与开发定制 ───
    # Slack 办公沟通以英文为主
    com.tinyspeck.slackmacgap:
      ascii_mode: true
    # MacVim 独占 Vim 模式切换
    org.vim.MacVim:
      ascii_mode: true
      vim_mode: true

  style:
    color_scheme: rheatin_solarized_light  # 浅色模式自适应 Rheatin Solarized Light
    color_scheme_dark: rheatin_solarized   # 深色模式自适应 Rheatin Solarized Dark

    text_orientation: horizontal
    candidate_list_layout: linear
    translucency: true                     # 磨砂毛玻璃
    inline_preedit: false                  # 关闭行内预编辑：拼音显示在独立候选小窗内，彻底杜绝所有软件光标死锁冲突！
    corner_radius: 10                      # 外框圆角
    hilited_corner_radius: 6               # 选中胶囊圆角
    border_height: 6                       # 上下呼吸边距
    border_width: 10                       # 左右呼吸边距
    line_spacing: 6
    spacing: 12
    # ⚠️ 不要在这里设 font_face / font_point。
    # SquirrelTheme 用 `fontName ?= config.getString("style/font_face")` 取值：
    # 一旦 style/font_face 存在，配色方案里的 font_face 就永远不会生效 (?= 不覆盖)。
    # 配色方案 (preset_color_schemes/*) 的 font_face 才是真正生效的那一份，
    # 浅色/深色各一套字体，由 color_scheme / color_scheme_dark 切换。
    label_font_point: 13
    comment_font_point: 14

  # 自定义配色方案：Rheatin Solarized Light (浅色暖象牙白)
  preset_color_schemes/rheatin_solarized_light:
    name: "Rheatin Solarized Light"
    author: "Rheatin"
    candidate_format: "%c %@ "   # 极简微距排版
    back_color: 0xeee3f6fd                 # Solarized Base3 柔暖象牙白底色 (0xAABBGGRR)
    border_color: 0xeee3f6fd
    text_color: 0x8236d3                   # 内嵌拼音紫红
    # 字体一律用 PostScript 名（CTFontManagerCopyAvailablePostScriptNames 里的名字）。
    # 家族名 ("Symbols Nerd Font Mono") 与 PostScript 名 ("SymbolsNFM") 指向同一款字体，
    # 两者同时写会在回退链里产生重复项，故只保留 PostScript 名。
    # 顺序即回退链：思源宋体 -> 苹方 -> Symbols NF Mono -> Symbols NF
    font_face: "SourceHanSerifSC-Heavy, SourceHanSerifTC-Heavy, PingFangSC-Regular, SymbolsNFM, SymbolsNF"
    font_point: 18
    label_font_point: 13
    label_color: 0x837b65                  # 序号清晰色：Solarized Base00
    candidate_text_color: 0x756e58         # 候选词深墨色：Solarized Base01
    comment_text_color: 0x98a12a           # 提示注释色：Solarized Cyan
    hilited_candidate_text_color: 0xffffff # 选中文字纯白
    hilited_candidate_label_color: 0xffffff# 选中序号纯白
    hilited_candidate_back_color: 0x8236d3 # 胶囊紫红高亮底色
    hilited_comment_text_color: 0xe3f6fd

  preset_color_schemes/rheatin_solarized:
    name: "Rheatin Solarized"
    author: "Rheatin"
    candidate_format: "%c\u2005%@\u2005"   # 极简微距排版
    back_color: 0xee362b00                 # 毛玻璃半透明底色
    border_color: 0xee362b00
    text_color: 0x8236d3
    # 主体思源宋体 + 苹方 + Symbols Nerd Font 符号回退链
    # （字体名与浅色方案保持一致，均使用 PostScript 名）
    font_face: "SourceHanSerifSC-Heavy, SourceHanSerifTC-Heavy, PingFangSC-Regular, SymbolsNFM, SymbolsNF"
    font_point: 18
    label_font_point: 13
    label_color: 0xa1a093                  # 序号清晰色：Solarized Base1 柔亮灰白
    candidate_text_color: 0xa1a093
    comment_text_color: 0xc3f607e7
    hilited_candidate_text_color: 0xffffff
    hilited_candidate_label_color: 0xffffff # 选中项序号为纯白
    hilited_candidate_back_color: 0x8236d3 # 胶囊高亮底色
    hilited_comment_text_color: 0x362b00
