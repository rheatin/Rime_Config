patch:
  ascii_mode: true
  ascii_punct: true

  # 特定应用下的英文模式设定
  app_options:
    com.apple.Spotlight:
      ascii_mode: true
    com.alfredapp.Alfred:
      ascii_mode: true
    com.runningwithcrayons.Alfred-2:
      ascii_mode: true
    com.blacktree.Quicksilver:
      ascii_mode: true
    com.apple.Terminal:
      ascii_mode: true
      no_inline: true
    com.googlecode.iterm2:
      ascii_mode: true
      no_inline: true
    com.stablyai.orca:
      ascii_mode: true
      no_inline: true
    org.vim.MacVim:
      ascii_mode: true
      no_inline: true
      vim_mode: true
    com.apple.dt.Xcode:
      ascii_mode: true
    com.barebones.textwrangler:
      ascii_mode: true
    com.macromates.TextMate.preview:
      ascii_mode: true
    com.github.atom:
      ascii_mode: true
    com.microsoft.VSCode:
      ascii_mode: true
    com.sublimetext.2:
      ascii_mode: true
    org.gnu.Aquamacs:
      ascii_mode: true
    org.gnu.Emacs:
      ascii_mode: true
      no_inline: true
    co.zeit.hyper:
      ascii_mode: true
    com.torusknot.SourceTreeNotMAS:
      ascii_mode: true
    com.google.Chrome:
      inline: true
    com.microsoft.edgemac:
      inline: true
    ru.keepcoder.Telegram:
      inline: true

  style:
    color_scheme: rheatin_solarized
    color_scheme_dark: rheatin_solarized

    text_orientation: horizontal
    candidate_list_layout: linear
    translucency: true                     # 磨砂毛玻璃
    inline_preedit: true
    corner_radius: 10                      # 外框圆角
    hilited_corner_radius: 6               # 选中胶囊圆角
    border_height: 6                       # 上下呼吸边距
    border_width: 10                       # 左右呼吸边距
    line_spacing: 6
    spacing: 12
    font_face: "Lucida Grande, Symbols Nerd Font Mono, Symbols Nerd Font"
    font_point: 21
    label_font_point: 13
    comment_font_point: 14

  # 自定义配色方案：Rheatin Solarized
  preset_color_schemes/rheatin_solarized:
    name: "Rheatin Solarized"
    author: "Rheatin"
    candidate_format: "%c\u2005%@\u2005"   # 极简微距排版
    back_color: 0xee362b00                 # 毛玻璃半透明底色
    border_color: 0xee362b00
    text_color: 0x8236d3
    # 主体思源宋体 + 苹方 + Symbols Nerd Font 符号回退链
    font_face: "SourceHanSerifTC-Heavy, SourceHanSerifSC-Heavy, PingFang SC, Symbols Nerd Font Mono, Symbols Nerd Font, SymbolsNFM, SymbolsNF"
    font_point: 18
    label_font_point: 13
    label_color: 0xa1a093                  # 序号清晰色：Solarized Base1 柔亮灰白
    candidate_text_color: 0xffffff
    comment_text_color: 0x8098a12a
    hilited_candidate_text_color: 0xffffff
    hilited_candidate_label_color: 0xffffff # 选中项序号为纯白
    hilited_candidate_back_color: 0x8236d3 # 胶囊高亮底色
    hilited_comment_text_color: 0x362b00
