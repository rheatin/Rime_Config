patch:
  # 全局默认设定：默认进入英文模式
  ascii_mode: true
  ascii_punct: false

  # 分应用中英文自动切换设定 (默认全局英文，仅聊天通讯与浏览器等特定应用自动切中文)
  app_options:
    # ─── 聊天与通讯软件 (自动中文) ───
    com.tencent.xinWeChat:
      ascii_mode: false
    org.telegram.desktop:
      ascii_mode: false
    ru.keepcoder.Telegram:
      ascii_mode: false
    com.tinyspeck.slackmacgap:
      ascii_mode: false
    com.electron.lark:
      ascii_mode: false
    com.alibaba.DingTalkMac:
      ascii_mode: false
    com.apple.MobileSMS:
      ascii_mode: false

    # ─── 网页浏览器 (自动中文，开启行内预编辑) ───
    com.google.Chrome:
      ascii_mode: false
      inline: true
    com.apple.Safari:
      ascii_mode: false
      inline: true
    com.microsoft.edgemac:
      ascii_mode: false
      inline: true
    company.thebrowser.Browser:
      ascii_mode: false
      inline: true
    org.mozilla.firefox:
      ascii_mode: false
      inline: true

    # ─── 笔记写作与日常办公 (保持英文) ───
    com.apple.Notes:
      ascii_mode: true
    com.apple.mail:
      ascii_mode: true
    com.apple.reminders:
      ascii_mode: true
    com.microsoft.Word:
      ascii_mode: true
    com.microsoft.Excel:
      ascii_mode: true
    com.apple.iWork.Pages:
      ascii_mode: true
    com.apple.iWork.Keynote:
      ascii_mode: true
    notion.id:
      ascii_mode: true
    md.obsidian:
      ascii_mode: true

    # ─── 终端与命令行 (强制英文，禁止行内嵌入) ───
    com.apple.Terminal:
      ascii_mode: true
      no_inline: true
    com.stablyai.orca:
      ascii_mode: true
      no_inline: true
    com.googlecode.iterm2:
      ascii_mode: true
      no_inline: true
    co.zeit.hyper:
      ascii_mode: true
      no_inline: true

    # ─── 代码编辑器与开发工具 (强制英文) ───
    com.microsoft.VSCode:
      ascii_mode: true
    com.apple.dt.Xcode:
      ascii_mode: true
    com.torusknot.SourceTreeNotMAS:
      ascii_mode: true
    org.vim.MacVim:
      ascii_mode: true
      no_inline: true
      vim_mode: true
    com.apple.Spotlight:
      ascii_mode: true
    com.alfredapp.Alfred:
      ascii_mode: true
    com.runningwithcrayons.Alfred-2:
      ascii_mode: true
    com.blacktree.Quicksilver:
      ascii_mode: true

  style:
    color_scheme: rheatin_solarized
    color_scheme_dark: rheatin_solarized

    text_orientation: horizontal
    candidate_list_layout: linear
    translucency: true                     # 磨砂毛玻璃
    inline_preedit: true
    corner_radius: 10                      # 外框圆角
    hilited_corner_radius: 6               # 选中胶囊圆角
    border_height: 6                       # 上下呼吸边距
    border_width: 10                       # 左右呼吸边距
    line_spacing: 6
    spacing: 12
    font_face: "Lucida Grande, Symbols Nerd Font Mono, Symbols Nerd Font"
    font_point: 21
    label_font_point: 13
    comment_font_point: 14

  # 自定义配色方案：Rheatin Solarized
  preset_color_schemes/rheatin_solarized:
    name: "Rheatin Solarized"
    author: "Rheatin"
    candidate_format: "%c\u2005%@\u2005"   # 极简微距排版
    back_color: 0xee362b00                 # 毛玻璃半透明底色
    border_color: 0xee362b00
    text_color: 0x8236d3
    # 主体思源宋体 + 苹方 + Symbols Nerd Font 符号回退链
    font_face: "SourceHanSerifTC-Heavy, SourceHanSerifSC-Heavy, PingFang SC, Symbols Nerd Font Mono, Symbols Nerd Font, SymbolsNFM, SymbolsNF"
    font_point: 18
    label_font_point: 13
    label_color: 0xa1a093                  # 序号清晰色：Solarized Base1 柔亮灰白
    candidate_text_color: 0xffffff
    comment_text_color: 0x8098a12a
    hilited_candidate_text_color: 0xffffff
    hilited_candidate_label_color: 0xffffff # 选中项序号为纯白
    hilited_candidate_back_color: 0x8236d3 # 胶囊高亮底色
    hilited_comment_text_color: 0x362b00
