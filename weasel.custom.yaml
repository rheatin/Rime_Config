patch:
  # 基础行为设置 (Windows 小狼毫 Weasel)
  "style/color_scheme": rheatin_solarized
  "style/color_scheme_dark": rheatin_solarized
  "style/horizontal": true
  "style/inline_preedit": true

  # 字体设定 (思源宋体 Heavy + Symbols Nerd Font 符号回退)
  "style/font_face": "Source Han Serif SC Heavy, 思源宋体 Heavy, Source Han Serif SC, 思源宋体, SourceHanSerifSC-Heavy, SimSun, Microsoft YaHei, Symbols Nerd Font Mono, Symbols Nerd Font"
  "style/label_font_face": "Source Han Serif SC Heavy, 思源宋体 Heavy, Microsoft YaHei"
  "style/comment_font_face": "Source Han Serif SC Heavy, 思源宋体 Heavy, Microsoft YaHei"
  "style/font_point": 14
  "style/label_font_point": 11
  "style/comment_font_point": 12

# 现代胶囊排版核心参数
  "style/layout/border_width": 0
  "style/layout/corner_radius": 10               # 候选框整体外圆角
  "style/layout/round_corner": 10                # 胶囊圆角（设大一点形成完整半圆弧）
  "style/layout/margin_x": 12                    # 候选框左右外边距（大于 hilite_padding_x）
  "style/layout/margin_y": 8                     # 候选框上下外边距（大于 hilite_padding_y，彻底脱离边缘）
  "style/layout/candidate_spacing": 16           # 候选词横向间距
  "style/layout/hilite_spacing": 4               # 序号与汉字间距
  "style/layout/hilite_padding_x": 8             # 胶囊左右扩展
  "style/layout/hilite_padding_y": 4             # 胶囊上下扩展
  "style/layout/align_type": center

  # ══════════════════════════════════════════════════════════════════════════
  # 分应用中英文自动切换 (Windows / 小狼毫)
  #
  # 机制 (已核对 weasel 源码 RimeWithWeasel/RimeWithWeasel.cpp):
  #   * 键名 = 客户端进程的 exe 文件名 (小写、大小写不敏感)，不是窗口标题、
  #     不是 AppID、不是子进程名。
  #   * 值只认 bool。app_options 在**会话创建时**套用一次；同一 App 的
  #     中/英状态在该 App 自己的会话内保持 (global_ascii: false)。
  #   * 未列出的 App 不会被设置 ascii_mode，因此回落到 rime_frost 的
  #     switches/@0/reset: 1 → 英文。这正是「除聊天软件和浏览器外都是英文」。
  #   * 改了本文件必须「重新部署」才会生效 (小狼毫会重新读取 weasel.yaml)。
  #
  # 用 tools/New-AppOptions.ps1 可以自动把当前运行/已安装的程序补全成本文件的
  # 英文条目，避免遗漏。
  # ══════════════════════════════════════════════════════════════════════════
  app_options:
    # ─── 聊天与通讯软件 (自动中文) ───
    wechat.exe:
      ascii_mode: false
    weixin.exe:            # 新版微信 4.x
      ascii_mode: false
    wechatappex.exe:
      ascii_mode: false
    wxwork.exe:
      ascii_mode: false
    qq.exe:
      ascii_mode: false
    telegram.exe:
      ascii_mode: false
    slack.exe:
      ascii_mode: false
    discord.exe:
      ascii_mode: false
    feishu.exe:
      ascii_mode: false
    lark.exe:
      ascii_mode: false
    dingtalk.exe:
      ascii_mode: false
    whatsapp.exe:
      ascii_mode: false
    line.exe:
      ascii_mode: false
    teams.exe:
      ascii_mode: false
    ms-teams.exe:
      ascii_mode: false

    # ─── 网页浏览器 (自动中文) ───
    chrome.exe:
      ascii_mode: false
    msedge.exe:
      ascii_mode: false
    firefox.exe:
      ascii_mode: false
    brave.exe:
      ascii_mode: false
    opera.exe:
      ascii_mode: false
    vivaldi.exe:
      ascii_mode: false
    arc.exe:
      ascii_mode: false
    iexplore.exe:
      ascii_mode: false

    # ─── 以下为「显式英文」，保证即使将来改动 reset 也不会在这里翻车 ───
    # (未列出的 App 本来就默认英文，这里只是把核心工具钉死)
    # 系统外壳 / 资源管理器 / 设置 / 搜索
    explorer.exe:
      ascii_mode: true
    notepad.exe:
      ascii_mode: true
    systemsettings.exe:
      ascii_mode: true
    applicationframehost.exe:
      ascii_mode: true
    searchapp.exe:
      ascii_mode: true
    searchhost.exe:
      ascii_mode: true
    # 终端与命令行
    windowsterminal.exe:
      ascii_mode: true
    openconsole.exe:
      ascii_mode: true
    conhost.exe:
      ascii_mode: true
    cmd.exe:
      ascii_mode: true
    powershell.exe:
      ascii_mode: true
    pwsh.exe:
      ascii_mode: true
    wt.exe:
      ascii_mode: true
    # 代码与开发工具
    code.exe:
      ascii_mode: true
    "code - insiders.exe":
      ascii_mode: true
    cursor.exe:
      ascii_mode: true
    devenv.exe:
      ascii_mode: true
    sublime_text.exe:
      ascii_mode: true
    idea64.exe:
      ascii_mode: true
    pycharm64.exe:
      ascii_mode: true
    # 办公与笔记
    winword.exe:
      ascii_mode: true
    excel.exe:
      ascii_mode: true
    powerpnt.exe:
      ascii_mode: true
    notion.exe:
      ascii_mode: true
    obsidian.exe:
      ascii_mode: true
    # 工具类 (PowerToys / 启动器 / 截图 / 密码管理器等)
    powertoys.powerlauncher.exe:
      ascii_mode: true
    powertoys.quickaccess.exe:
      ascii_mode: true
    everything.exe:
      ascii_mode: true
    snipaste.exe:
      ascii_mode: true
    sharex.exe:
      ascii_mode: true
    keepassxc.exe:
      ascii_mode: true
    mstsc.exe:
      ascii_mode: true

  # 自定义配色方案：Rheatin Solarized
  "preset_color_schemes/rheatin_solarized":
    name: "Rheatin Solarized"
    author: "Rheatin"
    label_color: 0xa1a093                   # 柔亮白灰序号 (Base1)
    back_color: 0x362b00                    # Solarized base03 深青墨色
    border_color: 0x362b00
    text_color: 0x8236d3                    # 内嵌拼音紫红
    hilited_text_color: 0x98a12a            # 高亮编码青色
    candidate_text_color: 0xffffff          # 候选词纯白
    comment_text_color: 0x8098a12a          # 提示注释色
    hilited_candidate_text_color: 0xffffff  # 选中文字纯白
    hilited_candidate_label_color: 0xffffff # 选中序号纯白
    hilited_candidate_back_color: 0x8236d3  # 胶囊紫红高亮底色
    hilited_comment_text_color: 0x362b00