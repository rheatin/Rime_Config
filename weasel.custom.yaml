patch:
  "style/color_scheme": rheatin_solarized
  "style/color_scheme_dark": rheatin_solarized
  "style/horizontal": true
  "style/inline_preedit": true
  # 兼容 Windows 下思源宋体的多种中英文名称匹配
  "style/font_face": "思源宋体 Heavy, Source Han Serif SC Heavy, Source Han Serif TC Heavy, SourceHanSerifSC-Heavy, 思源宋体, Source Han Serif SC, Microsoft YaHei"
  "style/font_point": 14
  "style/label_font_point": 11
  "style/corner_radius": 8
  "style/hilited_corner_radius": 6
  "style/border_width": 0
  "style/margin_x": 10
  "style/margin_y": 6
  "style/spacing": 12
  "style/candidate_format": "%c\u2005%@\u2005"

  # 自定义配色方案：Rheatin Solarized (Windows 小狼毫)
  "preset_color_schemes/rheatin_solarized":
    name: "Rheatin Solarized"
    author: "Rheatin"
    font_face: "思源宋体 Heavy, Source Han Serif SC Heavy, Source Han Serif TC Heavy, SourceHanSerifSC-Heavy, 思源宋体, Source Han Serif SC, Microsoft YaHei"
    font_point: 14
    label_font_point: 11
    label_color: 0xa1a093                  # 柔亮白灰序号
    back_color: 0x362b00                   # Solarized base03
    border_color: 0x362b00
    text_color: 0x8236d3
    hilited_text_color: 0x98a12a
    candidate_text_color: 0xffffff
    comment_text_color: 0x8098a12a
    hilited_candidate_text_color: 0xffffff
    hilited_candidate_back_color: 0x8236d3 # 紫红胶囊
    hilited_comment_text_color: 0x362b00
