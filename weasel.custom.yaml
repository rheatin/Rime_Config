patch:
  # 基础行为设置 (Windows 小狼毫 Weasel)
  "style/color_scheme": rheatin_solarized
  "style/color_scheme_dark": rheatin_solarized
  "style/horizontal": true
  "style/inline_preedit": true

  # 字体设定 (思源宋体 Heavy + Symbols Nerd Font 符号回退)
  "style/font_face": "Source Han Serif SC Heavy, 思源宋体 Heavy, Source Han Serif SC, 思源宋体, SourceHanSerifSC-Heavy, SimSun, Microsoft YaHei, Symbols Nerd Font Mono, Symbols Nerd Font"
  "style/label_font_face": "Source Han Serif SC Heavy, 思源宋体 Heavy, Microsoft YaHei"
  "style/comment_font_face": "Source Han Serif SC Heavy, 思源宋体 Heavy, Microsoft YaHei"
  "style/font_point": 14
  "style/label_font_point": 11
  "style/comment_font_point": 12

# 现代胶囊排版核心参数
  "style/layout/border_width": 0
  "style/layout/corner_radius": 10               # 候选框整体外圆角
  "style/layout/round_corner": 10                # 胶囊圆角（设大一点形成完整半圆弧）
  "style/layout/margin_x": 12                    # 候选框左右外边距（大于 hilite_padding_x）
  "style/layout/margin_y": 8                     # 候选框上下外边距（大于 hilite_padding_y，彻底脱离边缘）
  "style/layout/candidate_spacing": 16           # 候选词横向间距
  "style/layout/hilite_spacing": 4               # 序号与汉字间距
  "style/layout/hilite_padding_x": 8             # 胶囊左右扩展
  "style/layout/hilite_padding_y": 4             # 胶囊上下扩展
  "style/layout/align_type": center

  # 分应用中英文自动切换设定 (默认全局英文，仅特定应用自动切中文)
  app_options:
    # ─── 仅少数聊天软件与浏览器默认中文 ───
    wechat.exe:
      ascii_mode: false
    wxwork.exe:
      ascii_mode: false
    qq.exe:
      ascii_mode: false
    telegram.exe:
      ascii_mode: false
    slack.exe:
      ascii_mode: false
    feishu.exe:
      ascii_mode: false
    dingtalk.exe:
      ascii_mode: false
    chrome.exe:
      ascii_mode: false
    msedge.exe:
      ascii_mode: false
    firefox.exe:
      ascii_mode: false

    # ─── 笔记办公、终端与代码工具全部默认英文 ───
    winword.exe:
      ascii_mode: true
    excel.exe:
      ascii_mode: true
    powerpnt.exe:
      ascii_mode: true
    notion.exe:
      ascii_mode: true
    obsidian.exe:
      ascii_mode: true
    windowsterminal.exe:
      ascii_mode: true
    cmd.exe:
      ascii_mode: true
    powershell.exe:
      ascii_mode: true
    pwsh.exe:
      ascii_mode: true
    code.exe:
      ascii_mode: true
    code - insiders.exe:
      ascii_mode: true
    cursor.exe:
      ascii_mode: true
    devenv.exe:
      ascii_mode: true

  # 自定义配色方案：Rheatin Solarized
  "preset_color_schemes/rheatin_solarized":
    name: "Rheatin Solarized"
    author: "Rheatin"
    label_color: 0xa1a093                   # 柔亮白灰序号 (Base1)
    back_color: 0x362b00                    # Solarized base03 深青墨色
    border_color: 0x362b00
    text_color: 0x8236d3                    # 内嵌拼音紫红
    hilited_text_color: 0x98a12a            # 高亮编码青色
    candidate_text_color: 0xffffff          # 候选词纯白
    comment_text_color: 0x8098a12a          # 提示注释色
    hilited_candidate_text_color: 0xffffff  # 选中文字纯白
    hilited_candidate_label_color: 0xffffff # 选中序号纯白
    hilited_candidate_back_color: 0x8236d3  # 胶囊紫红高亮底色
    hilited_comment_text_color: 0x362b00