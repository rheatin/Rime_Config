# ==============================================================================
# 📋 Rime 快速文本与代码片段 (Snippets) 配置文件
# 格式：以 / 开头的触发词映射为候选项列表
# 支持使用 | 声明原生多行块文本，无需任何 \n 转义与脆弱的 Tab
# ==============================================================================

# ─── 1. 开发工程与系统脚本 (Dev & Scripting) ──────────────────────────────────
/sh:
  - text: |
      #!/usr/bin/env bash
      set -euo pipefail
      IFS=$'\n\t'
      
      SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
    desc: 严谨健壮的 Bash 脚本头部模板

/py:
  - text: |
      #!/usr/bin/env python3
      # -*- coding: utf-8 -*-

      import os
      import sys
    desc: Python 3 脚本基础头部

/main:
  - text: |
      def main():
          pass


      if __name__ == "__main__":
          main()
    desc: Python 主函数执行入口

/ignore:
  - text: |
      .DS_Store
      Thumbs.db
      node_modules/
      __pycache__/
      *.pyc
      .env
      *.log
      .idea/
      .vscode/
    desc: 常见跨平台通用的 .gitignore 忽略规则

/anc: # comment anchors
  - text: |
      > [TODO]: 
      > 注意：这里填写可能引发意外的操作风险。
    desc: GitHub / Obsidian 待办块 (TODO)
  - text: |
      > [NOTE]: 
      > 这里填写需要特别强调的重点提示信息。
    desc: GitHub / Obsidian 提示块 (Note)
  - text: |
      > [FIXME]: 
      > 注意：这里填写可能引发意外的操作风险。
    desc: GitHub / Obsidian 待修复块 (Fixme) 

# ─── 2. Git 提交规范与协作 (Git Workflow) ────────────────────────────────────
/git:
  - text: "✨ Feat: "
    desc: ✨ 新功能与主要特性 (Feat)
  - text: "🚀 Update: "
    desc: 🚀 增强优化与功能迭代 (Update)
  - text: "🔧 Fix: "
    desc: 🔧 缺陷修复与稳定性补丁 (Fix)
  - text: "🐛 Bug: "
    desc: 🐛 边缘缺陷与已知漏洞修复 (Bug)
  - text: "📝 Docs: "
    desc: 📝 文档注释与说明更新 (Docs)
  - text: "💄 UI: "
    desc: 💄 视觉样式与界面微调 (UI)
  - text: "⚙️ Chore: "
    desc: ⚙️ 构建工具与日常维护变动 (Chore)
  - text: "♻️ Refactor: "
    desc: ♻️ 代码重构且不改变外部行为 (Refactor)
  - text: "⚡️ Perf: "
    desc: ⚡️ 性能优化与执行加速 (Perf)
  - text: "🧪 Test: "
    desc: 🧪 单元测试与测试用例增加 (Test)
  - text: "🔒 Sec: "
    desc: 🔒 安全漏洞修复与权限加固 (Sec)
  - text: "🍱 Sign: "
    desc: 🍱 资源文件、元数据与签名更新 (Sign)

/pr:
  - text: |
      ## 📌 Summary
      - 
      
      ## 🛠️ Changes
      - 
      
      ## 🧪 Testing Verification
      - [ ] Verified locally
    desc: GitHub / GitLab 标准 PR 描述模板

/review:
  - text: "No concern from my side."
    desc: GitHub / GitLab 代码评审标准回复模板

# ─── 3. Markdown 排版与文档设计 (Markdown & Layout) ──────────────────────────
/table:
  - text: |
      | 名称 / Item | 类型 / Type | 说明 / Description |
      | :--- | :--- | :--- |
      | 属性 A | String | 必填项说明 |
      | 属性 B | Number | 可选配置项 |
    desc: Markdown 三列表格模板


/todo:
  - text: |
      - [ ] 
      - [ ] 
      - [x] 
    desc: Markdown 待办勾选清单

# ─── 4. 职场邮件与高效沟通 (Work & Communication) ────────────────────────────

/sign:
  - text: |
      Best regards,
      Char
    desc: 英文邮件落款签名
  - text: |
      祝好，
      Char
    desc: 中文邮件落款签名

/thx:
  - text: "Thank you for your time and assistance."
    desc: 英文邮件标准感谢致谢
  - text: "非常感谢您的支持与协助！"
    desc: 中文商务感谢致谢

/afk:
  - text: "您好，我目前暂时外出/休假中，稍后会尽快回复您的消息。如有紧急事务，请致电联系，谢谢！"
    desc: 临时外出 / 休假自动回复话术

# ─── 5. 测试数据、占位与网络信息 (Mock & Network) ─────────────────────────────
/mask:
  - text: "255.255.255.0"
    desc: IPv4 子网掩码

/mock:
  - text: |
      {
        "code": 200,
        "message": "success",
        "data": {
          "id": 1001,
          "name": "Test User",
          "email": "test@example.com",
          "status": "active"
        }
      }
    desc: RESTful API JSON 响应 Mock 数据

/lorem:
  - text: "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua."
    desc: 拉丁占位假文
  - text: "昔人已乘黄鹤去，此地空余黄鹤楼。黄鹤一去不复返，白云千载空悠悠。晴川历历汉阳树，芳草萋萋鹦鹉洲。"
    desc: 中文占位假文（黄鹤楼）
  - text: "君不见，黄河之水天上来，奔流到海不复回。君不见，高堂明镜悲白发，朝如青丝暮成雪。"
    desc: 中文占位假文（将进酒）

/line:
  - text: "────────────────────────────────────────────────────────"
    desc: 常用纯文本细单分割线
  - text: "════════════════════════════════════════════════════════"
    desc: 常用纯文本双横分割线
