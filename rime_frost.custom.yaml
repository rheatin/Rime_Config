patch:
  # 初始中英文状态：英文 (reset: 1)
  "switches/@0/reset": 1

  # 默认开启 Emoji 候选项直接输出 (💀 关 / 😄 开)
  "switches/@4/reset": 1

  # 挂载聚合了 MoeType (萌娘百科) 的白霜拼音扩展词库
  "translator/dictionary": rime_frost.extended

  # 挂载万象 (Wanxiang) LTS 语言模型提升长句整句命中率
  "grammar/language": wanxiang-lts-zh-hans
  "grammar/collocation_max_length": 5
  "grammar/collocation_min_length": 2
  "grammar/non_collocation_penalty": -4
  "translator/grammar_penalty": -4

  # 符号系统：导入正统 symbols_v.yaml
  "punctuator/symbols":
    __include: symbols_v:/symbols

  # 正则识别器：释放 v 给符号系统，计算器改为 C 引导 (如 C1+1)
  "recognizer/patterns/calculator": "^[Cc].*$"
  "recognizer/patterns/punct": "^v([0-9]|10|[A-Za-z]+)$"

  # 核心按键绑定：强制大键盘与小键盘数字键 1~5 在有菜单时 100% 准确选词
  "key_binder/bindings":
    - { when: has_menu, accept: "1", select: 0 }
    - { when: has_menu, accept: "2", select: 1 }
    - { when: has_menu, accept: "3", select: 2 }
    - { when: has_menu, accept: "4", select: 3 }
    - { when: has_menu, accept: "5", select: 4 }
    - { when: has_menu, accept: KP_1, select: 0 }
    - { when: has_menu, accept: KP_2, select: 1 }
    - { when: has_menu, accept: KP_3, select: 2 }
    - { when: has_menu, accept: KP_4, select: 3 }
    - { when: has_menu, accept: KP_5, select: 4 }
    - { when: has_menu, accept: semicolon, select: 1 }   # 分号 ; 快捷选第 2 项
    - { when: has_menu, accept: minus, send: Page_Up }    # 减号 - 向上翻页
    - { when: has_menu, accept: equal, send: Page_Down }  # 等号 = 向下翻页
