# ==============================================================================
# Rime 全局默认配置补丁: default.custom.yaml
# 动态生成：锁定当前用户自选的主输入方案为 rime_frost
# ==============================================================================
patch:
  # 输入方案列表：仅保留当前用户自选方案
  schema_list:
    - schema: rime_frost

  # 候选词数量
  menu/page_size: 5

  # 分应用中西文切换隔离保护 (将 ascii_mode 移出 save_options)
  switcher/save_options:
    - full_shape
    - ascii_punct
    - traditionalization
    - emoji
    - chinese_english
    - chaifen
    - mars
    - pin_cand

  # 中文模式下单双引号直接输出标准英文半角直引号 ' 与 "
  "punctuator/half_shape/'": "'"
  'punctuator/half_shape/"': '"'

  # 中西文切换快捷键
  ascii_composer:
    good_old_caps_lock: true
    switch_key:
      Caps_Lock: clear
      Shift_L: inline_ascii
      Shift_R: clear
      Control_L: noop
      Control_R: noop
