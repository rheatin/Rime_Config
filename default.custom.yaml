patch:
  # 输入方案列表：仅保留白霜拼音 (rime_frost)，彻底杜绝误切到纯英文方案 melt_eng
  schema_list:
    - schema: rime_frost

  # 候选词数量
  menu/page_size: 5

  # 中西文切换逻辑
  ascii_composer:
    good_old_caps_lock: true
    switch_key:
      Caps_Lock: clear
      Shift_L: inline_ascii
      Shift_R: clear
      Control_L: noop
      Control_R: noop

  # 快捷键定制：强制大键盘与小键盘数字键在有候选时 100% 选字
  key_binder/+:
    bindings:
      - { when: has_menu, accept: "1", select: 0 }
      - { when: has_menu, accept: "2", select: 1 }
      - { when: has_menu, accept: "3", select: 2 }
      - { when: has_menu, accept: "4", select: 3 }
      - { when: has_menu, accept: "5", select: 4 }
      - { when: has_menu, accept: KP_1, select: 0 }
      - { when: has_menu, accept: KP_2, select: 1 }
      - { when: has_menu, accept: KP_3, select: 2 }
      - { when: has_menu, accept: KP_4, select: 3 }
      - { when: has_menu, accept: KP_5, select: 4 }
      - { when: has_menu, accept: semicolon, select: 1 } # 分号选第 2 项
