patch:
  # 输入方案列表：仅保留白霜拼音 (rime_frost)
  schema_list:
    - schema: rime_frost

  # 候选词数量
  menu/page_size: 5

  # 中西文切换逻辑
  ascii_composer:
    good_old_caps_lock: true
    switch_key:
      Caps_Lock: clear
      Shift_L: inline_ascii
      Shift_R: clear
      Control_L: noop
      Control_R: noop
